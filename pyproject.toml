[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-popnow"
dynamic = ["version"]
description = "LangChain integration for PopNow: tools that let LangChain and LangGraph agents generate AI images, videos, music and speech."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "PopNow" }]
keywords = [
  "langchain",
  "langgraph",
  "popnow",
  "agents",
  "tools",
  "ai-image-generator",
  "ai-video-generator",
  "text-to-image",
  "text-to-video",
  "text-to-speech",
  "ai-music",
  "generative-ai",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "langchain-core>=0.3.15,<2.0.0",
  "popnow>=0.3.0,<1.0.0",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "langchain-tests>=0.3.20",
  "langgraph>=0.3",
]

[project.urls]
Homepage = "https://popnow.ai"
Documentation = "https://github.com/popnow-ai/langchain-popnow#readme"
"API docs" = "https://popnow.ai/docs"
Pricing = "https://popnow.ai/ai-price-index"
Repository = "https://github.com/popnow-ai/langchain-popnow"
Issues = "https://github.com/popnow-ai/langchain-popnow/issues"
Changelog = "https://github.com/popnow-ai/langchain-popnow/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "langchain_popnow/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["langchain_popnow"]

[tool.hatch.build.targets.sdist]
include = ["/langchain_popnow", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["compile: smoke test that the package imports"]
